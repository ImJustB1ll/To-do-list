<!DOCTYPE html>
<html lang="id" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
        <title>To Do List</title>
        <meta name="description" content="Aplikasi to-do list modern, elegan, dan intuitif untuk mengatur tugas harian, prioritas, kategori, dan deadline secara produktif." />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="ambient-glow" aria-hidden="true"></div>
        <div class="ambient-glow-secondary" aria-hidden="true"></div>

        <canvas id="confetti-canvas" aria-hidden="true"></canvas>

        <div class="app-wrapper">
            <header class="app-header">
                <div class="brand-section">
                    <div class="brand-icon" aria-hidden="true">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                        </svg>
                    </div>
                    <div class="brand-title-wrap">
                        <h1 id="app-title">To Do List</h1>
                        <p class="brand-subtitle" id="current-date">Rencanakan &amp; wujudkan hari produktifmu</p>
                    </div>
                </div>

                <div class="header-actions">
                    <button id="theme-toggle" class="btn-icon" aria-label="Ganti Tema Gelap / Terang" title="Ganti Tema">
                        <svg id="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg id="icon-moon" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <section class="progress-card" aria-label="Progress Penyelesaian Tugas">
                <div class="progress-header">
                    <div class="progress-title-group">
                        <h2>Progres Tugas</h2>
                        <span class="progress-subtitle" id="progress-status-text">Memuat statistik tugas...</span>
                    </div>
                    <span class="progress-pill" id="progress-percentage">0%</span>
                </div>
                <div class="progress-bar-container" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar-fill" id="progress-bar-fill"></div>
                </div>
            </section>

            <main>
                <div class="todo_app">
                    <h2 class="form-header-title">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary)">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                        Task that should be done
                    </h2>

                    <form id="todo_form" class="todo-form-container">
                        <div class="input-main-row">
                            <span class="input-icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="8" x2="12" y2="16"></line>
                                    <line x1="8" y1="12" x2="16" y2="12"></line>
                                </svg>
                            </span>
                            <input
                                type="text"
                                id="input_box"
                                placeholder="Tuliskan tugas baru yang ingin diselesaikan..."
                                aria-label="Input tugas baru"
                                required
                                autocomplete="off"
                            />
                        </div>

                        <div class="form-options-row">
                            <div class="option-group">
                                <div class="input-sub-wrap">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-sub-icon" aria-hidden="true">
                                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                                        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                                    </svg>
                                    <input
                                        type="text"
                                        id="course_input"
                                        class="input-custom"
                                        placeholder="Mata Kuliah (opsional)"
                                        aria-label="Nama Mata Kuliah"
                                        autocomplete="off"
                                    />
                                </div>

                                <div class="input-sub-wrap">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-sub-icon" aria-hidden="true">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <polyline points="12 6 12 12 16 14"></polyline>
                                    </svg>
                                    <input
                                        type="datetime-local"
                                        id="due_date"
                                        class="date-custom"
                                        aria-label="Tenggat Waktu / Deadline Tugas"
                                        title="Pilih Tanggal dan Jam Deadline"
                                    />
                                </div>
                            </div>

                            <button type="submit" id="submit_btn" class="btn-submit">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                                <span>Tambah</span>
                            </button>
                        </div>
                    </form>

                    <div id="deadline-banner" class="deadline-banner" style="display: none;" role="alert"></div>

                    <div class="toolbar">
                        <div class="search-box-wrap">
                            <span class="search-icon" aria-hidden="true">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                            </span>
                            <input type="text" id="search_input" placeholder="Cari" aria-label="Cari" />
                        </div>

                        <div class="toolbar-controls">
                            <div class="sort-wrap">
                                <label for="sort_select" class="sort-label">Urutkan:</label>
                                <select id="sort_select" class="select-sort" aria-label="Urutkan Tugas">
                                    <option value="created">Terbaru</option>
                                    <option value="deadline">Deadline Terdekat</option>
                                </select>
                            </div>

                            <div class="filter-tabs" role="tablist">
                                <button type="button" class="tab-btn active" data-filter="all" role="tab" aria-selected="true">
                                    Semua <span class="tab-count" id="count-all">0</span>
                                </button>
                                <button type="button" class="tab-btn" data-filter="active" role="tab" aria-selected="false">
                                    Aktif <span class="tab-count" id="count-active">0</span>
                                </button>
                                <button type="button" class="tab-btn" data-filter="completed" role="tab" aria-selected="false">
                                    Selesai <span class="tab-count" id="count-completed">0</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <ul id="list" aria-label="Daftar Tugas"></ul>

                    <div id="empty-state" class="empty-state" style="display: none;">
                        <div class="empty-state-icon" aria-hidden="true">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <path d="m9 12 2 2 4-4"></path>
                            </svg>
                        </div>
                        <h3 class="empty-state-title" id="empty-state-title">Tidak ada tugas</h3>
                        <p class="empty-state-desc" id="empty-state-desc">Rencana yang terorganisir membuat harimu jauh lebih produktif!</p>
                    </div>

                    <div class="list-summary-bar">
                        <span id="items-left-text">0 tugas tersisa</span>
                        <button type="button" id="clear_completed_btn" class="btn-clear-completed" style="display: none;">
                            Bersihkan yang Selesai
                        </button>
                    </div>
                </div>
            </main>

            <footer>
                <div class="footer-credits">
                    <span>Dibuat oleh</span>
                    <strong>ImJustBill &amp; Omorhie</strong>
                </div>
            </footer>
        </div>

        <div id="toast-container" class="toast-container" aria-live="polite"></div>

        <script src="script.js"></script>
    </body>
</html>
