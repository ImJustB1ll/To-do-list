<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>To Do List</title>
    </head>
    <body>
        <header>
            <h1>To Do List</h1>
        </header>
        <main>
            <div class="todo_app">
                <h2>Task that should be done</h2>
                <form id="todo_form" class="row">
                    <input type="text" id="input_box" placeholder="Add something" aria-label="New task input" required />
                    <button type="submit">Add</button>
                </form>
                <ul id="list"></ul>
            </div>
        </main>
        <footer>
            <i>Created by ImJustBill &amp; Omorhie</i>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
